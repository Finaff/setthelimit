    <text x="150" y="134" text-anchor="middle" font-family="Arial Black, Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="bold" font-size="42" fill="#1B1E21">LIMIT</text>
    <text x="150" y="335" text-anchor="middle" font-family="Arial Black, Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="bold" font-size="220" fill="#1B1E21">?</text>
