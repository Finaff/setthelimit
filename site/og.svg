  <text x="470" y="354" font-family="Georgia, serif" font-size="32" fill="#EEF0EC">Set yours in three minutes.</text>
  <text x="470" y="420" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="bold" font-size="24" fill="#B4BAB2" letter-spacing="3">SETTHELIMIT.COM</text>
